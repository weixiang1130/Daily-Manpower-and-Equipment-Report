# Netlify 部署設定
#
# 目錄結構為「前端／後端／文件」三大項（見 README.md），Netlify 的三個預設路徑
# （publish=根、functions=netlify/functions、edge_functions=netlify/edge-functions）
# 在本結構下全部不適用，因此都必須明示。改動目錄時三處要一起改。
#
# ⚠ 三個 key 的寫法不同，不可類推：
#   publish / edge_functions 都在 [build] 底下（edge_functions 是「字串」＝目錄名，
#     **不是** [edge_functions] 區段——那個名稱在 Netlify 是 [[edge_functions]]
#     宣告式路由用的陣列，寫成區段會讓 Basic Auth 不被部署，整站變成公開）
#   functions 目錄則在獨立的 [functions] 區段
[build]
  # 建置：由環境變數 LOCAL_CONFIG_JS 產生 frontend/config.local.js（真實名單不進 GitHub）
  command = "node scripts/build-config.mjs"
  # 發布：只有 frontend/ 是對外靜態資產；後端與文件不發布
  publish = "frontend"
  # 整站 Basic Auth（auth.ts 內以 path: "/*" 宣告攔截範圍）
  edge_functions = "backend/cloud/edge-functions"

[functions]
  # 資料 API（api.mjs 內以 export const config = { path: "/api/data" } 宣告路由）
  directory = "backend/cloud/functions"

# 安全性回應標頭（靜態前端與 /api 皆套用）。
# CSP 與地端 .NET（Program.cs）／server.mjs **必須逐字一致**——同一份前端。
# HSTS 由 Netlify 於自訂網域自動提供，此處不重複宣告。
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
